    const checkHumanFaceInImage = (base64Img) => {
      return new Promise((resolve) => {
        try {
          const img = new Image();
          img.onload = async () => {
            if ("FaceDetector" in window) {
              try {
                const detector = new FaceDetector({ fastMode: true, maxDetectedFaces: 3 });
                const detected = await Promise.race([
                  detector.detect(img),
                  new Promise(resolveTimeout => setTimeout(() => resolveTimeout(null), 650))
                ]);

                if (Array.isArray(detected)) {
                  resolve(detected.length > 0);
                  return;
                }
              } catch (e) {
                // FaceDetector가 현재 이미지 형식을 처리하지 못하면 아래 휴리스틱으로 이어갑니다.
              }
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 140;
            canvas.height = 140;
            ctx.drawImage(img, 0, 0, 140, 140);

            const imageData = ctx.getImageData(0, 0, 140, 140);
            const data = imageData.data;
            let skinPixelCount = 0;
            let centralSkinPixelCount = 0;
            const totalPixels = 140 * 140;

            for (let i = 0; i < data.length; i += 4) {
              const r = data[i];
              const g = data[i + 1];
              const b = data[i + 2];
              const pixelIndex = i / 4;
              const x = pixelIndex % 140;
              const y = Math.floor(pixelIndex / 140);

              const max = Math.max(r, g, b);
              const min = Math.min(r, g, b);
              const isSkin = r > 95 && g > 45 && b > 30 && (max - min) > 14 && r > g * 1.05 && r > b * 1.15;

              if (isSkin) {
                skinPixelCount++;
                if (x >= 32 && x <= 108 && y >= 24 && y <= 116) {
                  centralSkinPixelCount++;
                }
              }
            }

            const skinRatio = skinPixelCount / totalPixels;
            const centralSkinRatio = centralSkinPixelCount / (77 * 93);
            resolve(skinRatio >= 0.025 && centralSkinRatio >= 0.035);
          };
          img.onerror = () => resolve(true);
          img.src = base64Img;

      const total = 6;

      const getCoordinates = (index, total, radius) => {
        const angle = (Math.PI * 2 / total) * index - Math.PI / 2;
        return {
          x: cx + radius * Math.cos(angle),
          y: cy + radius * Math.sin(angle)
        };
      };

          const pt = getCoordinates(i, total, r * level);
          return `${pt.x},${pt.y}`;
        }).join(" ");

                stroke="#ffffff"

            {list.map((item, i) => {
              const labelPt = getCoordinates(i, total, r + 24);
              let textAnchor = "middle";
              if (Math.abs(labelPt.x - cx) > 10) {
                textAnchor = labelPt.x > cx ? "start" : "end";

              return (
                <text

    const compressImage = (file) => {
      return new Promise((resolve) => {
        try {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;
              const maxDim = 800;

              if (width > height && width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.82));
            };
            img.onerror = () => resolve(e.target.result);
            img.src = e.target.result;
          };
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(file);
        } catch (err) {
          resolve(null);
        }
      });
    };

    const normalizeAIResult = (aiResult, nickname) => {
      const safeResult = aiResult && typeof aiResult === "object" ? aiResult : {};
      const normalizedGender = ["여성", "남성", "판단 어려움"].includes(safeResult.gender)
        ? safeResult.gender
        : "판단 어려움";
      const fallback = generateDynamicAIResult(nickname, normalizedGender);
      const recommendedCategory = ALLOWED_CATEGORIES.includes(safeResult.recommendedCategory)
        ? safeResult.recommendedCategory
        : fallback.recommendedCategory;

      const normalizedTopCategories = Array.isArray(safeResult.topCategories)
        ? safeResult.topCategories
            .filter(item => item && ALLOWED_CATEGORIES.includes(item.category))
            .map(item => ({
              category: item.category,
              score: Math.max(30, Math.min(99, Number(item.score) || 70))
            }))
        : [];

      const topCategoryNames = new Set(normalizedTopCategories.map(item => item.category));
      if (!topCategoryNames.has(recommendedCategory)) {
        normalizedTopCategories.unshift({ category: recommendedCategory, score: 96 });
        topCategoryNames.add(recommendedCategory);
      }

      fallback.topCategories.forEach(item => {
        if (normalizedTopCategories.length < 10 && !topCategoryNames.has(item.category)) {
          normalizedTopCategories.push(item);
          topCategoryNames.add(item.category);
        }
      });

      return {
        ...fallback,
        ...safeResult,
        hasFace: safeResult.hasFace !== false,
        gender: normalizedGender,
        genderEmoji: getGenderEmoji(normalizedGender),
        faceType: { ...fallback.faceType, ...(safeResult.faceType || {}) },
        radarKeywords: Array.isArray(safeResult.radarKeywords) && safeResult.radarKeywords.length >= 6
          ? safeResult.radarKeywords.slice(0, 6)
          : fallback.radarKeywords,
        recommendedCategory,
        categoryReasoning: safeResult.categoryReasoning || `${recommendedCategory} 촬영과 잘 어울리는 분위기와 무드가 사진에서 자연스럽게 드러납니다.`,
        topCategories: normalizedTopCategories.slice(0, 10)
      };
    };

    const SparklesIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
      </svg>
    );

    const UploadIcon = () => (
      <svg className="w-5 h-5 text-slate-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    );

    const DownloadIcon = () => (
      <svg className="w-4 h-4 mr-1.5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
    );

    const ShareIcon = () => (
      <svg className="w-4 h-4 mr-1.5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
      </svg>
    );

    function App() {
      const [nickname, setNickname] = useState("");
      const [uploadedPhotos, setUploadedPhotos] = useState([]);

      const [loading, setLoading] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);
      const [noFaceModal, setNoFaceModal] = useState(false);
      const [result, setResult] = useState(null);
      const [resultReady, setResultReady] = useState(false);

      const cardRef = useRef(null);
      const fileInputRef = useRef(null);
      const workerScrollRef = useRef(null);
      const workerScrollPausedRef = useRef(false);
      const workerScrollResumeTimerRef = useRef(null);

      useEffect(() => {
        if (!result) {
          setResultReady(false);
          return;
        }

        setResultReady(false);
        const readyTimer = setTimeout(() => setResultReady(true), 120);
        return () => clearTimeout(readyTimer);
      }, [result]);

      useEffect(() => {
        if (!result) return;

        const scrollTimer = setInterval(() => {
          const el = workerScrollRef.current;
          if (!el || workerScrollPausedRef.current) return;

          const loopStartItem = el.children[MOCK_WORKERS.length];
          const loopWidth = loopStartItem ? loopStartItem.offsetLeft : el.scrollWidth / 2;
          if (loopWidth <= el.clientWidth) return;

          if (el.scrollLeft >= loopWidth) {
            el.scrollLeft = el.scrollLeft - loopWidth;
          } else {
            el.scrollLeft = el.scrollLeft + 1;
          }
        }, 38);

        return () => {
          clearInterval(scrollTimer);
          if (workerScrollResumeTimerRef.current) {
            clearTimeout(workerScrollResumeTimerRef.current);
          }
        };
      }, [result]);

      useEffect(() => {
        if (!result) return;

        let tries = 0;
        const tick = () => {
          const el = workerScrollRef.current;
          if (el) {
            el.scrollLeft = 0;
            return;
          }
          tries += 1;
          if (tries < 20) requestAnimationFrame(tick);
        };

        requestAnimationFrame(tick);
      }, [result]);

      const pauseWorkerAutoScroll = () => {
        workerScrollPausedRef.current = true;
        if (workerScrollResumeTimerRef.current) {
          clearTimeout(workerScrollResumeTimerRef.current);
        }
      };

      const resumeWorkerAutoScrollSoon = () => {
        if (workerScrollResumeTimerRef.current) {
          clearTimeout(workerScrollResumeTimerRef.current);
        }
        workerScrollResumeTimerRef.current = setTimeout(() => {
          workerScrollPausedRef.current = false;
        }, 1200);
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      const handleFileChange = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        if (uploadedPhotos.length + files.length > 3) {
          alert("사진은 최대 3장까지만 업로드할 수 있어요.");
          return;
        }

        for (const file of files) {
          const compressed = await compressImage(file);
          if (compressed) {
            setUploadedPhotos(prev => [...prev, compressed].slice(0, 3));
          }
        }
      };

      const removePhoto = (index) => {
        setUploadedPhotos(prev => prev.filter((_, i) => i !== index));
      };

      // ⏳ AI 분석 핸들러
      const handleAnalyze = async () => {
        if (uploadedPhotos.length === 0) {
          alert("사진을 최소 1장 이상 업로드해주세요.");
          return;
        }

        setResultReady(false);

        try {
          const targetImages = uploadedPhotos;
          const targetName = nickname.trim() || "크리에이터";

          const faceChecks = await Promise.all(targetImages.map(checkHumanFaceInImage));
          const isFaceDetected = faceChecks.some(Boolean);
          if (!isFaceDetected) {
            setLoading(false);
            setNoFaceModal(true);
            return;
          }

          setLoading(true);

          let aiAnalysisData;
          if (GEMINI_API_KEY.trim()) {
            aiAnalysisData = await callGeminiVisionAI(GEMINI_API_KEY.trim(), targetImages);
          } else {
            aiAnalysisData = generateDynamicAIResult(targetName);
          }

          if (aiAnalysisData.hasFace === false) {
            setLoading(false);
            setNoFaceModal(true);
            return;
          }

          const normalizedAIResult = normalizeAIResult(aiAnalysisData, targetName);

          setResult({
            nickname: targetName,
            images: targetImages,
            aiResult: normalizedAIResult
          });

        } catch (err) {
          console.error("AI 시각 분석 예외 처리:", err);
          setResult({
            nickname: nickname.trim() || "크리에이터",
            images: uploadedPhotos,
            aiResult: generateDynamicAIResult(nickname.trim())
          });
        } finally {
          setLoading(false);
        }
      };

      const waitForImagesInElement = async (element) => {
        const images = Array.from(element.querySelectorAll("img"));
        await Promise.all(images.map(img => {
          if (img.complete && img.naturalWidth > 0) return Promise.resolve();
          return new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve;
          });
        }));
      };

      const handleSaveImage = async () => {
        if (!cardRef.current) return;

        const target = cardRef.current;
        target.classList.add("capture-ready");

        try {
          setResultReady(true);
          await waitForImagesInElement(target);
          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

          const canvas = await html2canvas(target, {
            scale: 2,
            useCORS: true,
            allowTaint: true,
            backgroundColor: "#ffffff",
            imageTimeout: 15000,
            scrollX: 0,
            scrollY: -window.scrollY
          });

          const image = canvas.toDataURL("image/png");
          const a = document.createElement("a");
          a.href = image;
          a.download = `INPOSE-VISUAL-SCAN-${result?.nickname || 'USER'}.png`;
          a.click();
          showToast("결과 카드가 이미지로 저장되었어요!");
        } catch (err) {
          console.error("결과 카드 이미지 저장 실패:", err);
          alert("이미지 저장이 어려워요. 화면을 캡처해서 스토리에 공유해도 참여할 수 있어요.");
        } finally {
          target.classList.remove("capture-ready");
        }
      };

      const handleShareLink = () => {
        navigator.clipboard.writeText(window.location.href);
        showToast("링크가 복사됐어요");
      };

      return (
        <div className="full-aurora-bg min-h-screen w-full max-w-md rounded-[32px] shadow-2xl overflow-hidden border border-slate-100 flex flex-col my-0 sm:my-4 relative">
          
          {toastMsg && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-2xl flex items-center space-x-1.5 animate-bounce">
              <span className="text-rose-400">✓</span>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* 🚨 얼굴 미인식 원버튼 팝업 모달 */}
          {noFaceModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-5">
              <div className="bg-white w-full max-w-xs rounded-[20px] p-6 text-center space-y-4 shadow-2xl border border-slate-100 animate-pop-1">
                <div className="w-12 h-12 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
                  📸
                </div>
                <div className="space-y-1.5">
                  <h3 className="text-sm font-bold text-slate-900 font-headline">얼굴을 인식할 수 없어요</h3>
                  <p className="text-xs text-slate-500 font-normal leading-relaxed break-keep">
                    업로드하신 사진에서 인물의 얼굴을 찾지 못했습니다.<br />얼굴이 또렷하게 나온 다른 사진으로 올려주세요!
                  </p>
                </div>
                <button
                  onClick={() => {
                    setNoFaceModal(false);
                    setUploadedPhotos([]);
                  }}
                  className="w-full py-3 bg-inpose text-white font-semibold rounded-xl text-xs shadow-md shadow-rose-200 hover:opacity-95 transition cursor-pointer"
                >
                  다른 사진 업로드하기
                </button>
              </div>
            </div>
          )}

          <div className="px-6 pt-7 pb-4 text-center border-b border-rose-100/40 bg-white/40 backdrop-blur-md">
            <span className="inline-block px-3 py-0.5 rounded-full text-[10px] font-semibold bg-rose-50 text-rose-600 border border-rose-100 mb-1.5 tracking-wider">
              INPOSE VISUAL SCAN
            </span>
            <h1 className="text-xl font-headline text-slate-900 tracking-tight">
              나의 비주얼 심층 분석
            </h1>
          </div>

          {/* ⏳ 로딩 화면 */}
          {loading && (
            <div className="p-8 my-auto text-center flex flex-col items-center justify-center space-y-4 py-12 animate-fade-in">
              <div className="w-[120px] h-[120px] flex items-center justify-center relative">
                <img
                  src={INPOSE_LOGO_BASE64}
                  alt="INPOSE"
                  className="w-full h-full object-contain animate-pulse"
                />
              </div>
              <p className="text-xs font-semibold text-slate-600 tracking-tight mt-2">
                인포즈 AI가 비주얼을 분석하고 있어요...
              </p>
            </div>
          )}

          {!loading && !result && (
            <div className="p-6 flex flex-col space-y-3 my-auto">

              <ConceptThumbnail />

              <p className="text-xs text-slate-500 text-center leading-relaxed font-normal break-keep">
                사진 한 장으로 나의 무드와 분위기를 심층 분석해보세요.
              </p>

              <div className="space-y-3 text-left pt-1">
                <div>
                  <label className="text-xs font-semibold text-slate-700">닉네임</label>
                  <input
                    type="text"
                    placeholder="닉네임을 입력해 주세요 (선택)"
                    value={nickname}
                    onChange={(e) => setNickname(e.target.value)}
                    className="w-full px-3.5 py-2.5 bg-white/80 border border-slate-200/80 rounded-xl text-xs mt-1 focus:outline-none focus:border-rose-400 transition"
                  />
                </div>

                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-xs font-semibold text-slate-700">사진 업로드 (1~3장)</label>
                    <span className="text-[10px] text-rose-500 font-medium">{uploadedPhotos.length} / 3장</span>
                  </div>

                  <div className="grid grid-cols-3 gap-2 my-2">
                    {uploadedPhotos.map((img, idx) => (
                      <div key={idx} className="relative aspect-square rounded-xl overflow-hidden border border-slate-200 group">
                        <img src={img} className="w-full h-full object-cover" />
                        <button
                          type="button"
                          onClick={() => removePhoto(idx)}
                          className="absolute top-1 right-1 bg-slate-900/70 text-white w-5 h-5 rounded-full text-[10px] flex items-center justify-center"
                        >
                          ✕
                        </button>
                      </div>
                    ))}

                    {uploadedPhotos.length < 3 && (
                      <button
                        type="button"
                        onClick={() => fileInputRef.current?.click()}
                        className="aspect-square rounded-xl border-2 border-dashed border-slate-300 hover:border-rose-400 flex flex-col items-center justify-center bg-white/60 backdrop-blur-md transition"
                      >
                        <UploadIcon />
                        <span className="text-[10px] text-slate-400 font-medium">사진 추가</span>
                      </button>
                    )}
                  </div>

                  <input
                    type="file"
                    ref={fileInputRef}
                    onChange={handleFileChange}
                    accept="image/*"
                    multiple
                    className="hidden"
                  />
                </div>

                <button
                  onClick={handleAnalyze}
                  disabled={uploadedPhotos.length === 0}
                  className="w-full py-3.5 bg-inpose text-white font-semibold rounded-2xl shadow-md shadow-rose-200 hover:opacity-95 disabled:opacity-40 transition text-sm flex items-center justify-center space-x-1.5 mt-2 cursor-pointer disabled:cursor-not-allowed"
                >
                  <SparklesIcon className="w-4 h-4 text-white" />
                  <span>내 비주얼 무드 분석하기</span>
                </button>

                <p className="text-[11px] text-slate-400 text-center leading-normal pt-1 font-normal break-keep">
                  첨부한 사진은 무드 및 얼굴 분석 용도 이외에는 절대 사용되지 않으며, 페이지를 나가면 즉시 파기됩니다.
                </p>
              </div>

            </div>
          )}

          {/* 🎯 결과 페이지 */}
          {!loading && result && (
            <div className="p-4 space-y-4">
              
              {/* 📸 [이미지 저장 전용 범위: cardRef] */}
              <div
                ref={cardRef}
                className="py-3 px-2 relative overflow-hidden flex flex-col justify-between items-center text-center space-y-4 bg-white/30 rounded-3xl"
              >
                {/* 🌟 GenZ 상단 헤더 */}
                <div className="pt-2 pb-0.5 space-y-1 text-center">
                  <p className="text-xs font-semibold text-slate-500 tracking-tight">
                    <span className="text-slate-800 font-bold">{result.nickname}</span> 님은
                  </p>
                  <h2 className="text-lg sm:text-xl font-headline text-rose-500 tracking-tight break-keep">
                    <span className={resultReady ? "typing-title" : "opacity-0 inline-block"}>
                      {getGenZTitle(result.aiResult.faceType, result.aiResult.gender)}
                    </span>
                  </h2>
                  <div className={`flex flex-col items-center transition-opacity duration-500 ${resultReady ? "opacity-100" : "opacity-0"}`}>
                    <div className="flex flex-wrap items-center justify-center gap-1 px-4">
                      {getMoodTags(result.aiResult.faceType).map((tag) => (
                        <span key={tag} className="text-[10px] font-semibold text-slate-500">
                          {tag}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>

                {/* 1) 사진 영역 */}
                <div className="w-full my-1 flex justify-center items-center">
                  {result.images.length === 1 && (
                    <div className={`w-40 h-52 rounded-2xl overflow-hidden shadow-lg border-2 border-white bg-slate-100 ${resultReady ? "photo-reveal" : "opacity-0"}`} style={{ "--photo-rotate": "-1deg", "--photo-delay": "0.7s" }}>
                      <img src={result.images[0]} className="w-full h-full object-cover" />
                    </div>
                  )}

                  {result.images.length === 2 && (
                    <div className="flex items-center justify-center space-x-3">
                      <div className={`w-32 h-44 rounded-2xl overflow-hidden shadow-md border-2 border-white bg-slate-100 ${resultReady ? "photo-reveal" : "opacity-0"}`} style={{ "--photo-rotate": "-2deg", "--photo-delay": "0.7s" }}>
                        <img src={result.images[0]} className="w-full h-full object-cover" />
                      </div>
                      <div className={`w-32 h-44 rounded-2xl overflow-hidden shadow-lg border-2 border-white bg-slate-100 ${resultReady ? "photo-reveal" : "opacity-0"}`} style={{ "--photo-rotate": "2deg", "--photo-delay": "0.84s" }}>
                        <img src={result.images[1]} className="w-full h-full object-cover" />
                      </div>
                    </div>
                  )}

                  {result.images.length >= 3 && (
                    <div className="flex items-center justify-center -space-x-4 py-1">
                      <div className={`w-24 h-36 rounded-xl overflow-hidden shadow-sm border-2 border-white bg-slate-100 z-10 ${resultReady ? "photo-reveal" : "opacity-0"}`} style={{ "--photo-rotate": "-6deg", "--photo-delay": "0.7s" }}>
                        <img src={result.images[0]} className="w-full h-full object-cover" />
                      </div>
                      <div className={`w-28 h-40 rounded-2xl overflow-hidden shadow-md border-2 border-white bg-slate-100 z-30 ${resultReady ? "photo-reveal" : "opacity-0"}`} style={{ "--photo-rotate": "0deg", "--photo-delay": "0.84s" }}>
                        <img src={result.images[2] || result.images[0]} className="w-full h-full object-cover" />
                      </div>
                      <div className={`w-24 h-36 rounded-xl overflow-hidden shadow-sm border-2 border-white bg-slate-100 z-20 ${resultReady ? "photo-reveal" : "opacity-0"}`} style={{ "--photo-rotate": "6deg", "--photo-delay": "0.98s" }}>
                        <img src={result.images[1]} className="w-full h-full object-cover" />
                      </div>
                    </div>
                  )}
                </div>

                {/* 2) 🔥 [박스 1] AI 얼굴 & 인상 분위기 분석 */}
                <div className="w-full glass-box rounded-2xl p-4 text-left space-y-3.5 my-1">
                  <div className="flex items-center justify-between pb-2 border-b border-rose-100/60">
                    <span className="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                      <span>✨</span> AI 얼굴 & 무드 심층 스캔
                    </span>
                    <span className="text-[10px] font-semibold text-rose-500 bg-rose-50 px-2 py-0.5 rounded-full border border-rose-100">
                      {result.aiResult.genderEmoji || "🧑🏻"} {result.aiResult.gender || "판단 어려움"}
                    </span>
                  </div>

                  <div className="space-y-3 pt-0.5">
                    <DualGaugeBar
                      leftLabel="아랍상" leftScore={result.aiResult.faceType?.arab || 58} leftEmoji="🕌"
                      rightLabel="두부상" rightScore={result.aiResult.faceType?.tofu || 42} rightEmoji="🤍"
                    />

                    <DualGaugeBar
                      leftLabel="고양이상" leftScore={result.aiResult.faceType?.cat || 62} leftEmoji="🐱"
                      rightLabel="강아지상" rightScore={result.aiResult.faceType?.dog || 38} rightEmoji="🐶"
                    />

                    <DualGaugeBar
                      leftLabel="화려함" leftScore={result.aiResult.faceType?.glam || 64} leftEmoji="✨"
                      rightLabel="청순함" rightScore={result.aiResult.faceType?.pure || 36} rightEmoji="🫧"
                    />

                    <DualGaugeBar
                      leftLabel="차가움" leftScore={result.aiResult.faceType?.cold || 58} leftEmoji="❄️"
                      rightLabel="따뜻함" rightScore={result.aiResult.faceType?.warm || 42} rightEmoji="☀️"
                    />
                  </div>

                  <div className="pt-2 border-t border-rose-100/50">
                    <p className="text-[11px] text-slate-600 font-normal leading-relaxed break-keep">
                      {result.aiResult.faceImpressionSummary}
                    </p>
                  </div>
                </div>

                {/* 3) 🎯 [박스 2] 6각 방사형 분위기 키워드 차트 리포트 */}
                <div className="w-full glass-box rounded-2xl p-4 text-left space-y-2 my-1">
                  <div className="pb-2 border-b border-rose-100/60 flex items-center justify-between">
                    <div>
                      <span className="text-[10px] text-rose-500 font-bold uppercase tracking-wider block">INPOSE MOOD KEYWORDS</span>
                      <h3 className="text-sm font-bold text-slate-900">
                        나의 <span className="text-inpose font-extrabold">분위기 키워드</span> 리포트 🎯
                      </h3>
                    </div>
                  </div>

                  <p className="text-[11px] text-slate-600 font-normal leading-relaxed pt-1 break-keep">
                    인포즈에 가입하게 된다면, 나를 표현할 프로필 무드 키워드로 이 6가지를 설정해 보는 건 어떨까요?
                  </p>

                  <RadarChart keywords={result.aiResult.radarKeywords || []} />
                </div>

                {/* 4) 📌 [박스 3] 어울리는 추천 촬영 + 1문장 AI 요약 + AI 촬영 컨셉 매칭 TOP 10 */}
                <div className="w-full glass-box rounded-2xl p-4 text-left space-y-3 my-1">
                  <div className="pb-2 border-b border-rose-100/50 space-y-1">
                    <span className="text-[10px] text-rose-500 font-bold uppercase tracking-wider block">RECOMMENDED SHOOTING</span>
                    <h3 className="text-sm font-bold text-slate-900">
                      어울리는 촬영: <span className="text-rose-500 font-extrabold">{result.aiResult.recommendedCategory} 촬영</span>
                    </h3>
                    <p className="text-[11px] text-slate-600 font-normal leading-relaxed pt-1 break-keep">
                      {result.aiResult.categoryReasoning}
                    </p>
                  </div>

                  <div className="space-y-2 pt-1">
                    <span className="text-[11px] font-bold text-slate-800 block">AI 촬영 컨셉 매칭 TOP 10</span>
                    {(result.aiResult.topCategories || []).map((item, idx) => (
                      <div key={idx} className="flex items-center space-x-2 text-xs">
                        <span className="w-16 text-[11px] font-semibold text-slate-700 truncate text-left">
                          {item.category}
                        </span>

                        <div className="flex-1 h-2.5 bg-slate-200/50 rounded-full overflow-hidden relative flex items-center p-0.5">
                          <div
                            className="h-full bg-gradient-to-r from-[#e6455e] to-rose-400 rounded-full transition-all duration-1000 ease-out"
                            style={{ width: `${item.score}%` }}
                          ></div>
                        </div>

                        <span className="w-8 text-right text-[10px] font-bold text-slate-500 font-mono">
                          {item.score}%
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

              {/* 추천 크리에이터 섹션 */}
              <div className="pt-2 text-left space-y-2.5">
                <div>
                  <h4 className="text-xs font-bold text-slate-900">
                    {result.aiResult.recommendedCategory} 촬영을 하는 사람들이에요! ✨
                  </h4>
                  <p className="text-[10px] text-slate-500 mt-0.5 font-normal break-keep">
                    나에게 딱 맞는 크리에이터들과 인포즈에서 함께 작업해보세요! 프로필을 누르면 포트폴리오를 볼 수 있어요.
                  </p>
                </div>

                <div
                  ref={workerScrollRef}
                  onPointerDown={pauseWorkerAutoScroll}
                  onPointerUp={resumeWorkerAutoScrollSoon}
                  onPointerCancel={resumeWorkerAutoScrollSoon}
                  onTouchStart={pauseWorkerAutoScroll}
                  onTouchEnd={resumeWorkerAutoScrollSoon}
                  onWheel={() => {
                    pauseWorkerAutoScroll();
                    resumeWorkerAutoScrollSoon();
                  }}
                  className="flex space-x-3 overflow-x-auto no-scrollbar pb-1 pt-1 cursor-grab active:cursor-grabbing"
                >
                  {[...MOCK_WORKERS, ...MOCK_WORKERS].map((worker, idx) => {
                    const displayName = worker.nickname.length > 6 
                      ? worker.nickname.slice(0, 6) + '...' 
                      : worker.nickname;

                    return (
                      <a
                        key={`${worker.nickname}-${idx}`}
                        href={worker.webProfileUrl}
                        target="_blank"
                        rel="noreferrer"
                        className="flex-shrink-0 flex flex-col items-center text-center group"
                        style={{ width: '74px' }}
                      >
                        <div
                          style={{
                            width: '64px',
                            height: '64px',
                            minWidth: '64px',
                            minHeight: '64px',
                            borderRadius: '50%',
                            overflow: 'hidden',
                            flexShrink: 0,
                            border: '1.5px solid rgba(255, 255, 255, 0.9)',
                            backgroundColor: '#f1f5f9',
                            boxShadow: '0 3px 8px rgba(0, 0, 0, 0.06)'
                          }}
                          className="group-hover:scale-105 transition-transform duration-200"
                        >
                          <img
                            src={worker.profileImage}
                            alt={worker.nickname}
                            style={{
                              width: '100%',
                              height: '100%',
                              objectFit: 'cover',
                              display: 'block'
                            }}
                          />
                        </div>
                        
                        <div className="w-full text-center mt-1.5 px-0.5">
                          <p className="text-[11px] font-semibold text-slate-800 truncate w-full leading-tight" title={worker.nickname}>
                            {displayName}
                          </p>
                          <span className="block text-[8px] text-slate-400 font-medium uppercase leading-none pt-0.5">
                            {worker.workerType}
                          </span>
                        </div>
                      </a>
                    );
                  })}
                </div>
              </div>

              {/* 하단 버튼 2개 */}
              <div className="grid grid-cols-2 gap-2.5 pt-0.5">
                <button
                  onClick={handleSaveImage}
                  className="py-3.5 bg-inpose text-white font-semibold rounded-2xl shadow-md shadow-rose-200 hover:opacity-95 transition text-sm tracking-tight flex items-center justify-center cursor-pointer"
                >
                  <DownloadIcon />
                  <span>결과 카드 저장</span>
                </button>
                <button
                  onClick={handleShareLink}
                  className="py-3.5 bg-slate-800 text-white font-semibold rounded-2xl shadow-sm hover:bg-slate-700 transition text-sm tracking-tight flex items-center justify-center cursor-pointer"
                >
                  <ShareIcon />
                  <span>친구에게 공유하기</span>
                </button>
              </div>

              {/* 이벤트 안내 */}
              <div className="glass-box rounded-2xl p-4 text-left space-y-2.5">
                <h4 className="text-sm font-headline text-inpose flex items-center gap-1.5">
                  <span className="text-base leading-none">📣</span>
                  <span>지금 결과를 공유하고 경품을 받아보세요!</span>
                </h4>
                <ol className="text-xs text-slate-600 space-y-1.5 list-decimal list-inside leading-relaxed font-normal">
                  <li>인포즈 공식 SNS를 팔로우해요.</li>
                  <li>AI 추천 결과 이미지를 저장해요.</li>
                  <li>인스타그램 스토리에 공유하고 인포즈 계정을 태그해요.</li>
                  <li>이벤트 게시물 댓글에 닉네임과 추천 카테고리를 남겨요.</li>
                </ol>
                <div className="bg-rose-50 text-rose-600 font-semibold text-[11px] py-2 text-center rounded-xl border border-rose-100">
                  스토리로 공유하면 당첨 확률 UP!
                </div>
              </div>

              <button
                onClick={() => { setResult(null); setResultReady(false); setUploadedPhotos([]); setNickname(""); }}
                className="text-xs text-slate-400 font-normal underline block mx-auto py-0.5 hover:text-slate-600 cursor-pointer"
              >
                다른 사진으로 다시 분석하기
              </button>

              {/* 🌟 정식 인포즈 핑크 로고 적용 브랜드 안내 & 스토어 다운로드 3종 링크 섹션 */}
              <div className="mt-6 pt-6 border-t border-rose-100/60 text-center space-y-3.5">
                <div className="flex flex-col items-center space-y-1">
                  <img src={INPOSE_LOGO_BASE64} alt="INPOSE" className="w-12 h-12 object-contain mb-0.5" />
                  <h4 className="text-xs font-bold text-slate-800">
                    인포즈에 대해 더 궁금하신가요?
                  </h4>
                </div>

                <div className="space-y-2 pt-1">
                  {/* 1) 인스타그램 구경하기 */}
                  <a
                    href="https://www.instagram.com/inpose_official/"
                    target="_blank"
                    rel="noreferrer"
                    className="w-full py-3 px-4 bg-white/80 hover:bg-white border border-rose-100 text-slate-700 font-semibold rounded-2xl text-xs shadow-xs flex items-center justify-center space-x-2 transition cursor-pointer"
                  >
                    <InstagramIcon className="w-4 h-4 text-rose-500" />
                    <span>인포즈 인스타 구경하기</span>
                  </a>

                  {/* 2) 앱스토어 다운받기 */}
                  <a
                    href="https://apps.apple.com/us/app/inpose-creator-match/id1538711855"
                    target="_blank"
                    rel="noreferrer"
                    className="w-full py-3 px-4 bg-white/80 hover:bg-white border border-rose-100 text-slate-700 font-semibold rounded-2xl text-xs shadow-xs flex items-center justify-center space-x-2 transition cursor-pointer"
                  >
                    <AppStoreIcon className="w-5 h-5 text-slate-900" />
                    <span>앱스토어 다운받기</span>
                  </a>

                  {/* 3) 구글스토어 다운받기 */}
                  <a
                    href="https://play.google.com/store/apps/details?id=com.carpum.inpose"
                    target="_blank"
                    rel="noreferrer"
                    className="w-full py-3 px-4 bg-white/80 hover:bg-white border border-rose-100 text-slate-700 font-semibold rounded-2xl text-xs shadow-xs flex items-center justify-center space-x-2 transition cursor-pointer"
                  >
                    <PlayStoreIcon className="w-5 h-5" />
                    <span>구글스토어 다운받기</span>
                  </a>
                </div>
              </div>

            </div>
          )}

          <div className="p-3 border-t border-rose-100/30 text-center mt-auto">
            <p className="text-[10px] text-slate-400 font-normal">
              입력된 정보는 무드 분석 결과 생성에만 사용됩니다.
            </p>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
